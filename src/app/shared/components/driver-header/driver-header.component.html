<header class="driver-header">
  <div class="header-top">
    <div class="location-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      <span class="location-text">{{ locationName || 'Gurugram' }}</span>
    </div>
    
    <div class="header-actions">
      <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="'Current theme: ' + themeService.themeMode()">
        @if (themeService.activeTheme() === 'DARK') {
          <span>🌙</span>
        } @else {
          <span>☀️</span>
        }
      </button>

      <a routerLink="/notifications" class="notification-badge-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        @if (notificationService.unreadCount() > 0) {
          <span class="badge-count">{{ notificationService.unreadCount() }}</span>
        }
      </a>

      <button class="logout-btn" (click)="onLogout()" title="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="header-bottom">
    <div class="user-greeting">
      <h2>Hello, {{ driverName || 'Driver Partner' }} 👋</h2>
      <p class="subtitle">Ready for today's jobs?</p>
    </div>

    <div class="online-toggle-container">
      <label class="switch">
        <input type="checkbox" [checked]="isOnline" (change)="onToggleOnline($event)">
        <span class="slider round"></span>
      </label>
      <span class="status-label" [class.online]="isOnline">
        {{ isOnline ? 'ONLINE' : 'OFFLINE' }}
      </span>
    </div>
  </div>
</header>

<app-logout-modal
  [isOpen]="showLogoutModal"
  (confirm)="confirmLogout()"
  (cancel)="cancelLogout()">
</app-logout-modal>
