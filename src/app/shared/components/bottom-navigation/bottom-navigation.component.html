<nav class="bottom-nav">
  <a routerLink="/dashboard" (click)="onNavClick($event, '/dashboard')" routerLinkActive="active" class="nav-item">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    <span>Home</span>
  </a>

  <a [routerLink]="isPendingVerification ? null : '/jobs'" (click)="onNavClick($event, '/jobs')" routerLinkActive="active" class="nav-item" [class.disabled-tab]="isPendingVerification">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
      <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
    </svg>
    <span>Jobs</span>
  </a>

  @if (!isFleetDriver) {
    <a [routerLink]="isPendingVerification ? null : '/earnings'" (click)="onNavClick($event, '/earnings')" routerLinkActive="active" class="nav-item" [class.disabled-tab]="isPendingVerification">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
      <span>Earnings</span>
    </a>
  }

  <a [routerLink]="isPendingVerification ? null : '/profile'" (click)="onNavClick($event, '/profile')" routerLinkActive="active" class="nav-item" [class.disabled-tab]="isPendingVerification">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span>Profile</span>
