<div class="splash-screen-wrapper">
  <!-- Mobile Screen Container -->
  <div class="splash-card">

    <!-- Top Status Bar -->
    <!-- <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3L2 21h20L12 3z"/></svg>
        <svg class="icon-wifi" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
        <div class="battery"><div class="battery-level"></div></div>
      </div>
    </div> -->

    <!-- Header Logo Section -->
    <div class="logo-header">
      <div class="logo-mark">
        <svg viewBox="0 0 200 200" class="r-logo-svg">
          <defs>
            <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF7A00" />
              <stop offset="100%" stop-color="#E8500E" />
            </linearGradient>
          </defs>
          <path d="M 40 30 L 120 30 C 160 30 160 90 120 90 L 70 90 L 70 170 L 40 170 Z" fill="url(#orangeGrad)" />
          <path d="M 40 30 L 70 30 L 70 170 L 40 170 Z" fill="#0F172A" />
          <path d="M 70 90 L 140 170 L 105 170 L 40 95 Z" fill="#1E293B" />
          <path d="M 50 170 Q 75 110 135 45" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="12 8" fill="none"
            stroke-linecap="round" />
        </svg>
      </div>
      <h1 class="brand-title">RENTRON</h1>
      <p class="brand-tagline">— Drive. Ride. Build. We've Got You. —</p>
    </div>

    <!-- Hero Vehicles & Skyline Showcase Stage -->
    <div class="hero-stage">
      <!-- City Skyline Backdrop -->
      <div class="skyline-backdrop">
        <svg viewBox="0 0 500 200" preserveAspectRatio="none" class="skyline-svg">
          <path fill="#E2E8F0" opacity="0.6"
            d="M0 200 L0 120 L20 120 L20 100 L40 100 L40 150 L60 150 L60 80 L80 80 L80 180 L100 180 L100 60 L120 60 L120 30 L130 10 L140 30 L140 200 Z" />
          <path fill="#CBD5E1" opacity="0.5"
            d="M140 200 L140 90 L160 90 L160 140 L180 140 L180 70 L210 70 L210 40 L220 20 L230 40 L230 200 Z" />
          <path fill="#94A3B8" opacity="0.4"
            d="M230 200 L230 110 L250 110 L250 85 L280 85 L280 150 L310 150 L310 50 L320 30 L330 50 L330 200 Z" />
          <path fill="#CBD5E1" opacity="0.6"
            d="M330 200 L330 100 L350 100 L350 70 L380 70 L380 140 L410 140 L410 80 L420 60 L430 80 L430 200 Z" />
          <path fill="#E2E8F0" opacity="0.7"
            d="M430 200 L430 120 L450 120 L450 90 L480 90 L480 160 L500 160 L500 200 Z" />
        </svg>
      </div>

      <!-- Vehicle Assets Layer -->
      <div class="vehicles-showcase">
        <img src="assets/images/white_sedan.png" alt="Car" class="vehicle sedan-car" />
        <img src="assets/images/black_bike.png" alt="Bike" class="vehicle black-bike" />
        <img src="assets/images/jcb_loader.png" alt="JCB" class="vehicle jcb-loader" />
      </div>

      <!-- Ground Shadow & Platform Glow -->
      <div class="ground-shadow"></div>
    </div>

    <!-- Category Badges Section -->
    <div class="categories-section">
      <h3 class="categories-title">One App. Many Possibilities.</h3>
      <div class="category-pills">

        <!-- Cars Pill -->
        <div class="pill-item">
          <div class="icon-circle orange-bg">
            <svg viewBox="0 0 24 24" class="pill-icon">
              <path fill="currentColor"
                d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4h14v4z" />
              <circle cx="7.5" cy="14.5" r="1.5" fill="currentColor" />
              <circle cx="16.5" cy="14.5" r="1.5" fill="currentColor" />
            </svg>
          </div>
          <span class="pill-label">CARS</span>
        </div>

        <div class="pill-divider"></div>

        <!-- Bikes Pill -->
        <div class="pill-item">
          <div class="icon-circle navy-bg">
            <svg viewBox="0 0 24 24" class="pill-icon">
              <path fill="currentColor"
                d="M19.44 9.24L15.42 5H11v2h3.42l2.56 2.7-3.48 3.3-3.5-3.5H6c-1.1 0-2 .9-2 2v3h2v-3h3.09l3.5 3.5H6.82C6.4 13.84 5.27 13 4 13c-1.66 0-3 1.34-3 3s1.34 3 3 3c1.33 0 2.46-.86 2.87-2h7.95c.41 1.14 1.54 2 2.87 2 1.66 0 3-1.34 3-3 0-1.33-.86-2.46-2.01-2.87l3.76-3.89zM4 17c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm13.69-.13l-1.57-1.57c.27-.4.43-.88.43-1.4 0-1.38-1.12-2.5-2.5-2.5s-2.5 1.12-2.5 2.5 1.12 2.5 2.5 2.5c.52 0 1-.16 1.4-.43l1.57 1.57-1.4 1.4c-.45.45-1.05.69-1.67.69s-1.22-.24-1.67-.69l-1.4-1.4-1.42 1.42 1.4 1.4c.83.83 1.94 1.29 3.09 1.29s2.26-.46 3.09-1.29l1.4-1.4 1.42 1.42z" />
            </svg>
          </div>
          <span class="pill-label">BIKES</span>
        </div>

        <div class="pill-divider"></div>

        <!-- JCB Pill -->
        <div class="pill-item">
          <div class="icon-circle orange-bg">
            <svg viewBox="0 0 24 24" class="pill-icon">
              <path fill="currentColor"
                d="M19 13h-2V9h-2v4H9V5H7v8H5c-1.1 0-2 .9-2 2v4h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-4c0-1.1-.9-2-2-2zM8 19c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm11 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z" />
            </svg>
          </div>
          <span class="pill-label">JCB</span>
        </div>

      </div>
    </div>

    <!-- Bottom Dark Navy Wave Footer -->
    <div class="footer-wave-container">
      <div class="wave-stroke"></div>

      <!-- Footer Content -->
      <div class="footer-content">
        <div class="loader-box">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" [style.width.%]="progress"></div>
          </div>
          <div class="spinner-row">
            <div class="spinner-ring"></div>
            <span class="loading-text">{{ loadingText }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
